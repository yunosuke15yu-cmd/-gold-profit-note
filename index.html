<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#101923"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ゴールド収支ノート"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="description" content="ゴールド（XAUUSD）の損益を日ごとに記録。週別・月別の集計とJSONでのデータ移動に対応。"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: 'self'; connect-src 'self' https://qohtfituiipoglrgbrsl.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'"><title>ゴールド収支ノート</title><link rel="icon" href="icon-192.png"><style>html,body{margin:0;padding:0;min-width:280px}body{background:#f2f5f8}@media(prefers-color-scheme:dark){body{background:#151b22}}
/* MT5 LIVE compact card v1.1 */
.gn-live{padding:22px 24px!important;overflow:hidden}
.gn-live-head{display:flex!important;align-items:flex-start!important;justify-content:space-between!important;gap:14px!important;margin-bottom:18px!important}
.gn-live-head h2{margin:0!important;font-size:20px!important;line-height:1.25!important;letter-spacing:.02em!important}
.gn-live-sub{margin:5px 0 0!important;font-size:12px!important;color:var(--muted,#94a3b8)!important}
.gn-live-badge{display:inline-flex!important;align-items:center!important;gap:7px!important;flex:0 0 auto!important;padding:7px 10px!important;border-radius:999px!important;font-size:12px!important;font-weight:700!important;color:#55d6a9!important;background:rgba(45,180,130,.10)!important;border:1px solid rgba(85,214,169,.22)!important}
.gn-live-badge.off{color:var(--muted,#94a3b8)!important;background:rgba(148,163,184,.08)!important;border-color:rgba(148,163,184,.18)!important}
.gn-live-dot{display:block!important;width:7px!important;height:7px!important;border-radius:50%!important;background:currentColor!important;box-shadow:0 0 0 3px rgba(85,214,169,.10)!important}
.gn-live-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:0!important;border-top:1px solid var(--line,rgba(148,163,184,.18))!important}
.gn-live-item{min-width:0!important;padding:16px 12px 14px 0!important;border-bottom:1px solid var(--line,rgba(148,163,184,.18))!important}
.gn-live-item:nth-child(even){padding-left:18px!important;padding-right:0!important;border-left:1px solid var(--line,rgba(148,163,184,.18))!important}
.gn-live-item p{margin:0 0 7px!important;font-size:12px!important;line-height:1.35!important;color:var(--muted,#94a3b8)!important}
.gn-live-value{margin:0!important;font-size:18px!important;line-height:1.2!important;font-weight:700!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
@media(max-width:420px){
 .gn-live{padding:18px 18px!important}
 .gn-live-value{font-size:17px!important}
 .gn-live-item:nth-child(even){padding-left:14px!important}
}

.gn-analysis-card{margin-top:16px!important}
.gn-analysis-month{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted,#94a3b8);border:1px solid var(--line,rgba(148,163,184,.18));white-space:nowrap}

.gn-recent-card{margin-top:16px!important;padding:22px 24px!important;overflow:hidden}
.gn-recent-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line,rgba(148,163,184,.18))}
.gn-recent-table{width:100%;min-width:610px;border-collapse:collapse}
.gn-recent-table th{padding:12px 10px;text-align:left;font-size:11px;font-weight:600;color:var(--muted,#94a3b8);white-space:nowrap}
.gn-recent-table td{padding:13px 10px;border-top:1px solid var(--line,rgba(148,163,184,.14));font-size:13px;white-space:nowrap}
.gn-recent-table th:last-child,.gn-recent-table td:last-child{text-align:right}
.gn-recent-pnl{font-weight:700}
.gn-side-badge{display:inline-flex;min-width:44px;justify-content:center;padding:5px 7px;border-radius:7px;font-size:11px;font-weight:800}
.gn-side-badge.buy{color:#55d6a9;background:rgba(85,214,169,.10);border:1px solid rgba(85,214,169,.20)}
.gn-side-badge.sell{color:#f1848f;background:rgba(241,132,143,.10);border:1px solid rgba(241,132,143,.20)}
.gn-recent-empty{padding:24px 0 4px;color:var(--muted,#94a3b8);font-size:13px}
@media(max-width:420px){.gn-recent-card{padding:18px!important}}

/* Mobile trade cards */
.gn-trade-list{display:flex;flex-direction:column;border-top:1px solid var(--line,rgba(148,163,184,.18))}
.gn-trade-card{padding:15px 0;border-bottom:1px solid var(--line,rgba(148,163,184,.16))}
.gn-trade-card:last-child{border-bottom:0}
.gn-trade-top,.gn-trade-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gn-trade-left{display:flex;align-items:center;gap:10px;min-width:0}
.gn-trade-lot{font-size:13px;color:var(--text,#e5edf5);white-space:nowrap}
.gn-trade-profit{font-size:18px;line-height:1.2;white-space:nowrap}
.gn-trade-bottom{margin-top:9px;font-size:12px;color:var(--muted,#94a3b8)}
.gn-trade-price{white-space:nowrap}
@media(max-width:420px){
 .gn-trade-profit{font-size:17px}
 .gn-trade-bottom{font-size:11px}
}
/* Premium XAU dashboard skin */
:root{--gold:#d9b75f;--gold2:#f0ce72;--panel:#101923;--panel2:#131f2b}
body{background:radial-gradient(circle at 80% -10%,rgba(217,183,95,.09),transparent 28%),linear-gradient(180deg,#091118 0%,#0c151e 100%)!important}
.gn-shell{max-width:980px!important}
.gn-card{background:linear-gradient(180deg,rgba(19,31,43,.98),rgba(14,24,34,.98))!important;border:1px solid rgba(217,183,95,.30)!important;box-shadow:0 14px 40px rgba(0,0,0,.18)!important}
.gn-header{border-bottom-color:rgba(217,183,95,.18)!important}
.gn-brand-mark{border-color:rgba(217,183,95,.45)!important;color:var(--gold2)!important;background:linear-gradient(145deg,rgba(217,183,95,.14),rgba(217,183,95,.04))!important}
.gn-button{border-color:rgba(217,183,95,.22)!important;background:rgba(255,255,255,.025)!important}
.gn-live{position:relative}.gn-live:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.8}
.gn-analysis-month,.gn-pill{border-color:rgba(217,183,95,.25)!important;background:rgba(217,183,95,.055)!important}
.gn-chart-card{position:relative;overflow:hidden}.gn-chart-card:after{content:"";pointer-events:none;position:absolute;inset:0;background:radial-gradient(circle at 85% 0%,rgba(217,183,95,.07),transparent 32%)}
.gn-total{letter-spacing:-.045em!important;text-shadow:0 0 30px rgba(85,214,169,.08)}
.gn-trade-card{padding-left:8px!important;padding-right:8px!important;border-radius:10px}
.gn-live-grid{border-top-color:rgba(217,183,95,.16)!important}.gn-live-item{border-bottom-color:rgba(217,183,95,.12)!important}.gn-live-item:nth-child(even){border-left-color:rgba(217,183,95,.12)!important}
.gn-tabs{background:rgba(0,0,0,.12)!important;border:1px solid rgba(217,183,95,.12)!important}.gn-tab[aria-selected="true"]{background:rgba(217,183,95,.12)!important;color:var(--gold2)!important}
.gn-footer{border-top-color:rgba(217,183,95,.16)!important}
@media(max-width:600px){.gn-shell{padding-left:14px!important;padding-right:14px!important}.gn-card{border-radius:18px!important}}

/* Performance dashboard upgrade */
.gn-performance{padding:22px 24px!important;overflow:hidden}
.gn-perf-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.gn-perf-kicker{margin:0 0 4px;color:#e6c87a;font-size:10px;font-weight:800;letter-spacing:.18em}
.gn-perf-head h2{margin:0;font-size:22px}
.gn-perf-total{margin-top:8px;font-size:38px;font-weight:900;letter-spacing:-.04em}
.gn-perf-chart{height:190px;margin-top:16px;border-top:1px solid rgba(217,183,95,.14);padding-top:8px}
.gn-perf-chart svg{width:100%;height:100%;display:block;overflow:visible}
.gn-perf-split{display:grid;grid-template-columns:1.35fr .85fr;gap:12px;margin-top:12px}
.gn-goal,.gn-winring{border:1px solid rgba(217,183,95,.14);background:rgba(255,255,255,.018);border-radius:14px;padding:14px}
.gn-goal-row{display:flex;justify-content:space-between;gap:10px;color:var(--muted,#94a3b8);font-size:12px}
.gn-goal-row strong{color:#e6c87a}
.gn-goal-track{height:9px;border-radius:999px;background:rgba(148,174,205,.12);overflow:hidden;margin-top:12px}
.gn-goal-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#38d5a0,#67e2b8)}
.gn-winring{display:flex;align-items:center;gap:11px}
.gn-ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto}
.gn-ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#111d2a}
.gn-ring span{position:relative;z-index:1;font-size:11px;font-weight:800}
.gn-winring strong{display:block;font-size:13px}.gn-winring small{display:block;margin-top:3px;color:var(--muted,#94a3b8);font-size:10px}
.gn-live-value{font-size:clamp(16px,4.2vw,20px)!important;white-space:nowrap!important;letter-spacing:-.025em}
.gn-live-item{min-width:0!important;overflow:hidden}
@media(max-width:420px){
 .gn-performance{padding:18px!important}
 .gn-perf-total{font-size:34px}
 .gn-perf-chart{height:165px}
 .gn-perf-split{grid-template-columns:1fr}
 .gn-live-value{font-size:clamp(15px,4vw,18px)!important}
}
</style></head><body><div id="root"></div><noscript>このアプリを使うには、ブラウザでJavaScriptを有効にしてください。</noscript>
